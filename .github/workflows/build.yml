name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Clipalka.App/Clipalka.App.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match application version $version" }
      - name: Build patched native audio recorder and regression test
        shell: pwsh
        run: ./native/Build-Recorder.ps1
      - name: Restore
        run: dotnet restore CLIPALKA.sln
      - name: Test
        run: dotnet test CLIPALKA.sln -c Release --no-restore --collect:"XPlat Code Coverage"
      - name: Publish Windows x64
        run: |
          dotnet restore src/Clipalka.App/Clipalka.App.csproj -r win-x64 -p:Platform=x64
          dotnet publish src/Clipalka.App/Clipalka.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 --no-restore -o publish/win-x64
      - name: Inventory installed application files
        shell: pwsh
        run: ./installer/New-InstallManifest.ps1 -SourceDirectory publish/win-x64
      - name: Verify published native audio module
        shell: pwsh
        run: |
          $builtHash = (Get-FileHash artifacts/native/ScreenRecorderLib.dll).Hash
          $publishedHash = (Get-FileHash publish/win-x64/ScreenRecorderLib.dll).Hash
          if ($builtHash -ne $publishedHash) { throw 'Published native recorder does not match patched build' }
          $audioPath = Join-Path $PWD 'native-audio-verification'
          dotnet publish/win-x64/CLIPALKA.dll --verify-native-audio $audioPath
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path native-audio-verification/error.txt) { Get-Content native-audio-verification/error.txt }
            throw "Native audio verification failed: $LASTEXITCODE"
          }
          Get-Content native-audio-verification/result.txt
          Copy-Item artifacts/native/build-info.json native-audio-verification
      - name: Render WPF interface samples
        shell: pwsh
        run: |
          $previewPath = Join-Path $PWD 'ui-preview'
          dotnet publish/win-x64/CLIPALKA.dll --render-ui $previewPath
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path ui-preview/error.txt) { Get-Content ui-preview/error.txt }
            throw "WPF render failed: $LASTEXITCODE"
          }
      - name: Verify real Windows replay export
        shell: pwsh
        run: |
          $verificationPath = Join-Path $PWD 'export-verification'
          dotnet publish/win-x64/CLIPALKA.dll --verify-export $verificationPath
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path export-verification/error.txt) { Get-Content export-verification/error.txt }
            throw "Replay export verification failed: $LASTEXITCODE"
          }
          Get-Content export-verification/result.txt
      - name: Verify desktop controller input APIs
        shell: pwsh
        run: |
          $inputPath = Join-Path $PWD 'input-verification'
          dotnet publish/win-x64/CLIPALKA.dll --verify-input $inputPath
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path input-verification/error.txt) { Get-Content input-verification/error.txt }
            throw "Desktop controller verification failed: $LASTEXITCODE"
          }
          Get-Content input-verification/result.txt
      - name: Upload UI previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-ui-preview
          path: ui-preview
      - name: Verify Windows startup preference
        shell: pwsh
        run: |
          $startupPath = Join-Path $PWD 'startup-verification'
          dotnet publish/win-x64/CLIPALKA.dll --verify-startup $startupPath
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path startup-verification/error.txt) { Get-Content startup-verification/error.txt }
            throw "Startup preference verification failed: $LASTEXITCODE"
          }
          Get-Content startup-verification/result.txt
      - name: Upload startup verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-startup-verification
          path: startup-verification
      - name: Upload native audio verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-native-audio-verification
          path: native-audio-verification
      - name: Upload export verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-export-verification
          path: export-verification
      - name: Verify installer upgrade and uninstall
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          ./installer/Test-Upgrade.ps1 -Compiler $compiler
      - name: Upload installer verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-installer-verification
          path: artifacts/installer-verification
      - name: Download Visual C++ runtime
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile artifacts/VC_redist.x64.exe
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Clipalka.App/Clipalka.App.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          $fileVersion = $project.Project.PropertyGroup.FileVersion | Where-Object { $_ }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" "/DMyAppFileVersion=$fileVersion" installer/CLIPALKA.iss
          if ($LASTEXITCODE -ne 0) { throw 'Release installer compilation failed' }
      - name: Create portable archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath artifacts/CLIPALKA-win-x64.zip
      - name: Compute release checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = 'artifacts/CLIPALKA-Setup.exe', 'artifacts/CLIPALKA-win-x64.zip'
          $files | ForEach-Object {
            $hash = Get-FileHash $_ -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLIPALKA-win-x64
          path: publish/win-x64
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/CLIPALKA-Setup.exe
            artifacts/CLIPALKA-win-x64.zip
            artifacts/SHA256SUMS.txt
